<!DOCTYPE html>
<html lang="pt-br
">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho da janela do navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="./img/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="./img/foto-m.png" type="image/png">
        <img src="./img/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Reproduxindo Áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio preload="metadata" controls>
        <sources src="./midia/happy-mistake.mp3" type="audio/mpeg">
        <source src="./midia/happy-mistake.ogg" type="audio/ogg">
        <source src="./midia/happy-mistake.wav" type="audio/wav">
        <!-- evite wav pois é pesado -->
        <p>Seu navegador não consegue reproduzir áudios. <a href="midia/happy-mistake.mp3">Clique aqui para baixar o áudio</a></p>
    </audio>
</body>
</html>
