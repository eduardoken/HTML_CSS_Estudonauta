<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>

    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse em cima sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>

    <ul>
        <li><abbr title="Use a tag <p> para criar parágrafos">Parágrafo</abbr></li>

        <li><abbr title="Use a tag <h1> até <h6> para criar títulos">Títulos</abbr></li>

        <li><abbr title="Use a tag <img> para inserir imagens">Imagens</abbr></li>

        <li><abbr title="Use a tag <abbr> para criar abreviações">Abreviações</abbr></li>

        <li><abbr title="Use a tag <code> para criar código-fonte">Código-fonte</abbr></li>

        <li><abbr title="Use a tag <ol> para criar listas numeradas">Lista numerada</abbr></li>

        <li><abbr title="Use a tag <ul> para criar listas com demarcações">Lista com demarcações</abbr></li>
    </ul>
</body>
</html>
